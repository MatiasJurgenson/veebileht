<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/fox.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			try {
				const storedTheme = localStorage.getItem('theme');
				if (storedTheme) {
					document.documentElement.dataset.theme = JSON.parse(storedTheme);
				}
			} catch {
				// ignore storage access errors
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
				<style>
					/* Reset defaults to avoid unwanted scrollbars */
						:root {
							box-sizing: border-box;
							color-scheme: light;
							--page-bg: hsl(0 0% 98%);
							--page-text: hsl(0 0% 14%);
							--surface-bg: hsl(0 0% 25%);
							--surface-text: hsl(0 0% 100%);
							--surface-border: hsl(0 0% 100% / 0.12);
							--surface-hover: hsl(0 0% 10%);
						}
						:root[data-theme='dark'] {
							color-scheme: dark;
							--page-bg: hsl(0 0% 10%);
							--page-text: hsl(0 0% 96%);
							--surface-bg: hsl(0 0% 18%);
							--surface-text: hsl(0 0% 96%);
							--surface-border: hsl(0 0% 100% / 0.16);
							--surface-hover: hsl(0 0% 24%);
						}
					*, *::before, *::after { box-sizing: inherit; }
							html, body { height: 100%; margin: 0; }
							body {
								background: var(--page-bg);
								color: var(--page-text);
								transition: background-color 0.2s ease, color 0.2s ease;
							}

						.app-root {
							display: flex;
							flex-direction: column;
							min-height: 100dvh;
						}

						.app-root > nav,
						.app-root > footer {
							flex: 0 0 auto;
						}

						.app-root > *:not(nav):not(footer) {
							flex: 1 1 auto;
							min-height: 0;
						}
						
				</style>

		<div class="app-root">%sveltekit.body%</div>
	</body>
</html>
